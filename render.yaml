services:
  - type: web
    name: nexora-sentinel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard — use Neon, not Render Postgres
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MODEL_ARTIFACT_PATH
        value: ../ml/artifacts
