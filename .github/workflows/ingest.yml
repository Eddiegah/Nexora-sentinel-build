name: Data Ingestion (scheduled)

# Runs every day at 02:00 UTC.
# Also available as a manual trigger from the Actions tab.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days of historical data to fetch"
        required: false
        default: "30"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m ml.ingest.ingest --days-back ${{ github.event.inputs.days_back || '30' }}
